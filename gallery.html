<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck of Many Colors — Gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1017;
      --panel: #141b25;
      --panel-raised: #1a2431;
      --line: #2a394a;
      --text: #edf2f7;
      --muted: #9aaabd;
      --gold: #e7b85c;
      --gold-soft: #8b6b2d;
      --cyan: #55d7e8;
      --cyan-soft: #236d7a;
      --shadow: 0 18px 42px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -10%, #1b2939 0, var(--bg) 45rem);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: min(1500px, calc(100% - 2rem)); margin: 0 auto; }
    header { padding: 3rem 0 1.5rem; }
    .eyebrow { color: var(--gold); font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .25rem 0 .45rem; font: 700 clamp(2rem, 4vw, 3.35rem)/1.05 Georgia, serif; letter-spacing: -.025em; }
    .intro { max-width: 48rem; margin: 0; color: var(--muted); font-size: 1rem; }
    .topline { display: flex; align-items: end; justify-content: space-between; gap: 1rem; }
    .back-link { color: var(--cyan); text-decoration: none; white-space: nowrap; }
    .back-link:hover { text-decoration: underline; }
    .controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: .8rem;
      padding: 1rem; margin: 1rem 0 1.5rem;
      background: rgba(20, 27, 37, .86); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); position: sticky; top: .75rem; z-index: 2;
      backdrop-filter: blur(12px);
    }
    .filters { display: flex; gap: .4rem; }
    button, input { font: inherit; }
    .filter {
      border: 1px solid var(--line); border-radius: 999px; padding: .48rem .9rem;
      color: var(--muted); background: #111821; cursor: pointer;
    }
    .filter:hover, .filter.active { border-color: var(--gold); color: #fff; background: #302718; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .search { flex: 1 1 14rem; min-width: 12rem; position: relative; }
    .search input {
      width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: .55rem 1rem;
      background: #0e151e; color: var(--text); outline: none;
    }
    .search input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(85, 215, 232, .14); }
    .count { color: var(--muted); font-size: .9rem; margin-left: auto; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 32rem), 1fr)); gap: 1.25rem; padding-bottom: 3rem; }
    .card {
      min-width: 0; overflow: hidden; background: linear-gradient(145deg, #18212c, var(--panel));
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    }
    .card[data-theme="fantasy"] { border-top: 3px solid var(--gold-soft); }
    .card[data-theme="scifi"] { border-top: 3px solid var(--cyan-soft); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; padding: 1rem 1rem .65rem; }
    .card-title { margin: 0; font: 700 1.35rem/1.1 Georgia, serif; }
    .card-id { color: var(--gold); font: 700 .8rem/1 monospace; letter-spacing: .08em; }
    .theme { color: var(--muted); font-size: .73rem; letter-spacing: .12em; text-transform: uppercase; }
    .image-pair { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; padding: 0 .75rem; }
    .image-wrap { min-width: 0; }
    .image-button { display: block; width: 100%; padding: 0; border: 1px solid #314153; border-radius: 9px; overflow: hidden; background: #0a0e13; cursor: zoom-in; }
    .image-button:hover { border-color: var(--cyan); }
    .image-button img { display: block; width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; }
    .image-label { display: block; padding: .35rem .15rem .1rem; color: var(--muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
    .mood { margin: .8rem 1rem 1rem; color: #c2cedb; font-size: .91rem; }
    .empty { grid-column: 1/-1; padding: 3rem 1rem; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 14px; }
    dialog { width: min(94vw, 1000px); max-height: 94vh; padding: 0; border: 1px solid #53677b; border-radius: 12px; background: #090d13; box-shadow: 0 24px 80px #000; }
    dialog::backdrop { background: rgba(0, 0, 0, .82); backdrop-filter: blur(4px); }
    .lightbox-image { display: block; max-width: 100%; max-height: 88vh; margin: auto; object-fit: contain; }
    .close { position: absolute; top: .5rem; right: .65rem; width: 2.25rem; height: 2.25rem; border: 0; border-radius: 50%; color: #fff; background: rgba(0, 0, 0, .65); font-size: 1.4rem; cursor: pointer; }
    .close:hover { background: var(--cyan-soft); }
    @media (max-width: 650px) {
      .wrap { width: min(100% - 1rem, 1500px); }
      header { padding-top: 2rem; }
      .topline { align-items: start; flex-direction: column; }
      .controls { top: .35rem; }
      .count { width: 100%; margin-left: 0; }
      .gallery { grid-template-columns: 1fr; }
    }
    @media (max-width: 390px) { .image-pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="topline">
        <div>
          <div class="eyebrow">Christopher's reference deck · <span id="deck-total">104</span> cards</div>
          <h1>Deck of Many Colors — Gallery</h1>
          <p class="intro">Browse every finished art front alongside its matching layout preview. Filter by theme or search by card title and ID.</p>
        </div>
        <a class="back-link" href="./index.html">← Open deck viewer</a>
      </div>
    </header>

    <section class="controls" aria-label="Gallery controls">
      <div class="filters" role="group" aria-label="Filter by theme">
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="fantasy">Fantasy</button>
        <button class="filter" type="button" data-filter="scifi">Sci-Fi</button>
      </div>
      <label class="search"><span class="sr-only">Search cards</span><input id="search" type="search" placeholder="Search title or ID…" autocomplete="off"></label>
      <div class="count" id="count" aria-live="polite">Loading cards…</div>
    </section>

    <section class="gallery" id="gallery" aria-live="polite"></section>
  </main>

  <dialog id="lightbox" aria-label="Full-size card image">
    <button class="close" id="close-lightbox" type="button" aria-label="Close image">×</button>
    <img class="lightbox-image" id="lightbox-image" alt="">
  </dialog>

  <script src="./cards.js"></script>
  <script>
    let cards = [];
    let activeFilter = 'all';
    let searchTerm = '';

    const gallery = document.querySelector('#gallery');
    const count = document.querySelector('#count');
    const lightbox = document.querySelector('#lightbox');
    const lightboxImage = document.querySelector('#lightbox-image');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'}[character]));
    }

    function filteredCards() {
      return cards.filter(card => {
        const matchesTheme = activeFilter === 'all' || card.theme === activeFilter;
        const haystack = `${card.id} ${card.title}`.toLowerCase();
        return matchesTheme && haystack.includes(searchTerm);
      });
    }

    function render() {
      const visible = filteredCards();
      count.textContent = `${visible.length} card${visible.length === 1 ? '' : 's'} shown`;
      if (!visible.length) {
        gallery.innerHTML = '<div class="empty">No cards match that filter or search.</div>';
        return;
      }
      gallery.innerHTML = visible.map(card => {
        const themeName = card.theme === 'scifi' ? 'Sci-Fi' : 'Fantasy';
        const front = `./${card.art_front}`;
        const layout = `./${card.id}-layout.jpg`;
        return `<article class="card" data-theme="${escapeHtml(card.theme)}">
          <div class="card-head"><div><span class="theme">${themeName}</span><h2 class="card-title">${escapeHtml(card.title)}</h2></div><span class="card-id">${escapeHtml(card.id)}</span></div>
          <div class="image-pair">
            <div class="image-wrap"><button class="image-button" type="button" data-full="${escapeHtml(front)}" data-alt="${escapeHtml(card.id + ' — ' + card.title + ' art front')}"><img src="${escapeHtml(front)}" alt="${escapeHtml(card.id + ' — ' + card.title + ' art front')}" loading="lazy"></button><span class="image-label">Art front</span></div>
            <div class="image-wrap"><button class="image-button" type="button" data-full="${escapeHtml(layout)}" data-alt="${escapeHtml(card.id + ' — ' + card.title + ' layout preview')}"><img src="${escapeHtml(layout)}" alt="${escapeHtml(card.id + ' — ' + card.title + ' layout preview')}" loading="lazy"></button><span class="image-label">Layout preview</span></div>
          </div>
          <p class="mood">${escapeHtml(card.mood)}</p>
        </article>`;
      }).join('');
    }

    document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(item => item.classList.toggle('active', item === button));
      render();
    }));
    document.querySelector('#search').addEventListener('input', event => {
      searchTerm = event.target.value.trim().toLowerCase();
      render();
    });
    gallery.addEventListener('click', event => {
      const button = event.target.closest('.image-button');
      if (!button) return;
      lightboxImage.src = button.dataset.full;
      lightboxImage.alt = button.dataset.alt;
      lightbox.showModal();
    });
    document.querySelector('#close-lightbox').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', event => { if (event.target === lightbox) lightbox.close(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && lightbox.open) lightbox.close(); });

    if (window.DECK && Array.isArray(window.DECK.cards) && window.DECK.cards.length) {
      cards = window.DECK.cards;
      document.querySelector('#deck-total').textContent = cards.length;
      render();
    } else {
      count.textContent = 'Could not load cards.js';
      gallery.innerHTML = '<div class="empty">cards.js did not load. Make sure it sits next to gallery.html.</div>';
    }
  </script>
</body>
</html>
